name: Kraskus app community header update
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: kraskus-social-links-20261119
  cancel-in-progress: false
jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish qualified UI-only overlays
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/social-image-publish"
          mkdir -m700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          python3 releases/app-social-links-20261119/publish-images.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: app-social-links-published
          path: |
            releases/app-social-links-20261119/qualification.json
            releases/app-social-links-20261119/published-images.json
