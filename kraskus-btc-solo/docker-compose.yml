# BTC0.5.3: external-wallet UI; mainnet mining remains disabled in this Store profile.
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
  init:
    image: ghcr.io/kraskuscrypto/kraskus-btc-solo@sha256:6851765a0c7d9f11bf035c0fb0fd170e3c087d4fd4940a385cc3c431a2f69626
    user: 0:0
    network_mode: none
    entrypoint:
    - python
    - -c
    command:
    - import os; [(os.chown(p,10001,10001),os.chmod(p,0o700)) for p in ('/state','/node','/apptoken')];
      from pathlib import Path; p=Path('/state/node-settings'); p.mkdir(mode=0o700,exist_ok=True);
      os.chown(p,10001,10001); f=p/'prune-mib'; f.exists() or f.write_text('30000\n');
      os.chown(f,10001,10001); f.chmod(0o600)
    volumes:
    - ${APP_DATA_DIR}/data/state:/state
    - ${APP_DATA_DIR}/data/node:/node
    - ${APP_DATA_DIR}/data/apptoken:/apptoken
    restart: 'no'
  node:
    image: ghcr.io/kraskuscrypto/kraskus-btc-solo-node:0.5.0-dev@sha256:3321ad408515a5a3168e3c7e60f6942d2de49dce079d99dd884dab1aa20ab76e
    user: 10001:10001
    entrypoint:
    - /bin/sh
    - -c
    command:
    - prune=$$(cat /node-settings/prune-mib); case "$$prune" in ""|*[!0-9]*) exit
      64;; esac; [ "$$prune" -ge 1024 ] && [ "$$prune" -le 1024000 ] || exit 64; exec
      bitcoind "$$@" "-prune=$$prune"
    - node-pruning
    - -datadir=/node
    - -server=1
    - -disablewallet=1
    - -rpcbind=0.0.0.0
    - -rpcallowip=10.66.43.0/24
    - -rpcport=8332
    - -listen=0
    - -dbcache=1000
    - -maxmempool=300
    - -printtoconsole=0
    init: true
    stop_grace_period: 600s
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    volumes:
    - ${APP_DATA_DIR}/data/node:/node
    - ${APP_DATA_DIR}/data/state/node-settings:/node-settings:ro
    networks:
    - rpc
    - egress
    cpus: 2
    mem_limit: 2560m
    memswap_limit: 2560m
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
  api:
    image: ghcr.io/kraskuscrypto/kraskus-btc-solo@sha256:6851765a0c7d9f11bf035c0fb0fd170e3c087d4fd4940a385cc3c431a2f69626
    user: 10001:10001
    init: true
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      KRASKUS_APP_TOKEN_FILE: /run/kraskus-app-token/token
      KRASKUS_NODE_PRUNE_CONTROL: '1'
    volumes:
    - ${APP_DATA_DIR}/data/state:/state
    - ${APP_DATA_DIR}/data/node:/node:ro
    - ${APP_DATA_DIR}/data/apptoken:/run/kraskus-app-token
    networks:
    - rpc
    - front
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez',timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
  ui:
    image: ghcr.io/kraskuscrypto/kraskus-btc-solo-ui@sha256:b83e4f0c08eceb47881205cda5fdb2d592890c811561b2bee4b8a1e655f62a8a
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - DAC_READ_SEARCH
    security_opt:
    - no-new-privileges:true
    volumes:
    - ${APP_DATA_DIR}/data/apptoken:/run/kraskus-app-token:ro
    ports:
    - 127.0.0.1:33079:8080/tcp
    networks:
    - front
    - publish
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/livez
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 10s
networks:
  rpc:
    internal: true
    ipam:
      config:
      - subnet: 10.66.43.0/24
  front:
    internal: true
  publish: {}
  egress: {}
x-5tratumos-secure-proxy:
  version: 1
  ui_service: ui
  ui_port: 8080
  token_services:
  - api
