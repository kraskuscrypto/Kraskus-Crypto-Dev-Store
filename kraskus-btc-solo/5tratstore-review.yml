notes: >-
  DEVELOPMENT PREVIEW, mining disabled (no --enable-mining, no --allow-mainnet, no Stratum port). Images
  are the exact images qualified on VM100 on 2026-10-29 and re-qualified after publication by anonymous
  pull by digest (image IDs equal; app = source 4b968fc, UI and node = source e7bf79f): unit 95/95, platform
  24/24, isolated regtest 33/33, scanned with Trivy 0.76.1: UI clean;
  app/node no critical and no fixable findings (remaining Debian base findings documented in the release
  record). The UI listens on 127.0.0.1:33079 only and is reached through the authenticated portal route;
  RPC stays on the internal rpc network (10.66.43.0/24, fixed because bitcoind -rpcallowip needs it).
  Known open items: a settings save can take several seconds when the host disk stalls during a node's
  initial sync (durable SQLite commit; not weakened); platform limitations of stock 5tratumOS (shared
  portal origin, plain HTTP, local access to app ports, portal routes retained after uninstall).
  sourceUrl is the release provenance and third-party source information record (not the complete app source; the Kraskus app code is proprietary and preserved privately in Kraskus-Mining-Platform v3/btc).
  Test flags stay false until install/start/update/uninstall are verified from this store entry.
