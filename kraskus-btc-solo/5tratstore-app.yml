id: kraskus-btc-solo
name: Bitcoin by Kraskus
tagline: Bitcoin node and external-wallet solo-mining dashboard
description: Run a pruned Bitcoin Core node with an external-wallet dashboard, live
  worker telemetry, an interactive hashrate graph, block records, Bitcoin themes and
  safe pruning controls. A fixed 1% developer fee is a separate output in each found
  block; the miner receives the remainder. No native wallet, seed or private-key controls.
  This Store profile keeps mainnet mining disabled pending separate activation and
  a synchronized node. Kraskus Pool remains under development.
version: 0.5.3
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Mining-Platform/tree/3770ee318ae233d810c29bee4dfce79d8616247c/apps/btc-solo
support: https://kraskuscrypto.com/
icon: assets/btc-store-emblem-v2.png
port: 33079
path: /
uiMode: proxy
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
