notes: >-
  Dev candidate 0.2.33-dev14 migrates CHTA Solo to Kraskus App Template V2.
  The CheetahCoin Core and qualified CKPool image digests remain unchanged.
  The backend is based on the prior Dev6 image with one qualified correction:
  fresh parseable CKPool pool.status telemetry is treated as authoritative
  Stratum-online evidence when CKPool omits explicit online/ready flags.
  Qualification covered a fresh isolated install, live node synchronization,
  real payout validation/apply, full teardown/restart persistence, legacy UI
  to Template V2 upgrade state preservation, synced-node RPC, block-template
  telemetry, real mining.subscribe/mining.authorize, and nginx proxy startup.
  Dev2 corrects Template V2 sync-state mapping, centers the CHTA hero mark,
  and fixes the node/peer/miner summary spacing seen in live review.
  Dev5 uses a verified browser-decodable RGBA rendering of the canonical
  official CHTA green/yellow emblem for both the UI mark and Store/OS emblem.
  Dev6 switches in-app logo URLs to Workbench-safe relative paths so embedded
  reverse-proxy routing resolves the hero image correctly.
  Dev7 rebuilds the CHTA hero as a Template V2 medallion: official yellow CHTA
  mark integrated into a green/gold beveled coin face matching Kaspa/BTC styling.
  Dev8 collapses initial Home telemetry to one overview snapshot and defers
  page-specific pollers until their pages/dialogs are actually opened.
  Dev9 reports hashrate and connected miners from online workers only and
  persists a CKPool payout-era boundary so legacy pool blocks are excluded
  from the CHTA Solo Blocks ledger.
  Dev10 makes Mining and Blocks render immediately from the existing Home
  snapshot, then refreshes only the page-specific detail in the background.
  Dev11 moves the Store/OS emblem to a new cache-busting asset path so
  StratumOS cannot reuse the legacy CHTA icon cached under the old filename.
  Dev12 aligns the fresh-install Wallet setup with the Kaspa Template V2
  setup structure while keeping CHTA payout-only semantics truthful.
  Dev13 treats /api/overview as an optimization instead of a readiness gate,
  so fresh-sync installs render full Home/Mining/Blocks states from healthy
  individual endpoints while Core is still syncing.
  Dev14 adds the native CHTA wallet flow and its real node-backed wallet
  operations while preserving truthful fallback behavior.
  Dev15 adds a required 1% successful-block developer fee as a direct
  two-output coinbase split to the locked Kraskus fee address. CKPool's build
  is pinned to the portable C SHA256 path so GHCR artifacts do not inherit
  builder-specific AVX instructions, and the CKPool supervisor no longer
  replays stale reload requests after a full container restart.
  Main Store promotion remains intentionally separate.
