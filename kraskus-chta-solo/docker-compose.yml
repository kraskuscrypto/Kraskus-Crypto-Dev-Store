services:

  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 80


  init:
    image: ghcr.io/kraskuscrypto/kraskus-chta-solo@sha256:ecd132f97d5c7957dabc80e18eaa4517d87ee9f033d7b01b5d401e74dc515528
    restart: "no"
    user: "0:0"
    command:
      - python3
      - /qualification/init_config_v3.py
    volumes:
      - ${APP_DATA_DIR}/data/init_config_v3.py:/qualification/init_config_v3.py:ro
      - ${APP_DATA_DIR}/config:/kraskus-config
      - ${APP_DATA_DIR}/secrets:/run/secrets
      - ${APP_DATA_DIR}/pool:/ckpool-data
      - ${APP_DATA_DIR}/node:/node-data
    security_opt:
      - no-new-privileges:true

  cheetahcoin:
    image: ghcr.io/kraskuscrypto/kraskus-cheetahcoin-core@sha256:072f124dcbcff225733a0248f14689edafd1bedd402798f2d677dd4515fcd321
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command:
      - -datadir=/data
      - -conf=/kraskus-config/cheetahcoin.conf
    volumes:
      - ${APP_DATA_DIR}/node:/data
      - ${APP_DATA_DIR}/config:/kraskus-config:ro
    networks:
      - chta
    stop_grace_period: 90s
    healthcheck:
      test:
        - CMD-SHELL
        - /usr/local/bin/cheetahcoin-cli -datadir=/data -conf=/kraskus-config/cheetahcoin.conf getblockchaininfo >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true

  pool:
    image: ghcr.io/kraskuscrypto/kraskus-chta-ckpool@sha256:ad16b3e4a4c55d2786cb11792c84feacad30eba39f2903c7f328977798ab9440
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      cheetahcoin:
        condition: service_healthy
    ports:
      - "1926:3333"
    volumes:
      - ${APP_DATA_DIR}/config:/kraskus-config:ro
      - ${APP_DATA_DIR}/pool:/www
      - ${APP_DATA_DIR}/data/ckpool-entrypoint-v3.sh:/kraskus-entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - /kraskus-entrypoint.sh
    networks:
      - chta
    security_opt:
      - no-new-privileges:true

  pool_lowhash:
    image: ghcr.io/kraskuscrypto/kraskus-chta-ckpool-nmminer:0.2.35@sha256:4cd8084d6af70402bbb4875a5fa945387bb329c2d080232e40489bdb4a68b7d2
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      cheetahcoin:
        condition: service_healthy
    ports:
      - "1927:3333"
    volumes:
      - ${APP_DATA_DIR}/config:/kraskus-config:ro
      - ${APP_DATA_DIR}/pool-lowhash:/www
      - ${APP_DATA_DIR}/data/ckpool-lowhash-entrypoint-v1.sh:/kraskus-entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - /kraskus-entrypoint.sh
    networks:
      - chta
    security_opt:
      - no-new-privileges:true

  kraskus:
    image: ghcr.io/kraskuscrypto/kraskus-chta-solo:0.2.35@sha256:6c27cb2dc2ad7661fbff1318e6f3d8704a80bbf855b939de68e2011746dfd756
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      cheetahcoin:
        condition: service_healthy
      pool:
        condition: service_started
      pool_lowhash:
        condition: service_started

    environment:
      KRASKUS_API_HOST: 0.0.0.0
      KRASKUS_API_PORT: "18411"
      KRASKUS_APP_NAME: CheetahCoin by Kraskus
      KRASKUS_APP_VERSION: 0.2.35
      KRASKUS_CHTA_RPC_URL: http://cheetahcoin:8536/
      KRASKUS_CHTA_RPC_USER_FILE: /run/secrets/rpc-user
      KRASKUS_CHTA_RPC_PASSWORD_FILE: /run/secrets/rpc-password
      KRASKUS_CHTA_SHARELOG_DIR: /ckpool-data
      KRASKUS_CHTA_USERS_DIR: /ckpool-data/users
      KRASKUS_CHTA_CKPOOL_STATUS_FILE: /ckpool-data/pool/pool.status
      KRASKUS_CHTA_SETTINGS_FILE: /kraskus-config/settings.json
      KRASKUS_CHTA_CKPOOL_CONFIG: /kraskus-config/ckpool.conf
      KRASKUS_CHTA_RELOAD_REQUEST_FILE: /kraskus-config/reload-request.json
      KRASKUS_CHTA_RELOAD_ACK_FILE: /ckpool-data/reload-ack.json
      KRASKUS_CHTA_RELOAD_TIMEOUT: "20"
      KRASKUS_CHTA_STRATUM_PORT: "1926"
      KRASKUS_CHTA_LOWHASH_SHARELOG_DIR: /ckpool-lowhash-data
      KRASKUS_CHTA_LOWHASH_USERS_DIR: /ckpool-lowhash-data/users
      KRASKUS_CHTA_LOWHASH_CKPOOL_STATUS_FILE: /ckpool-lowhash-data/pool/pool.status
      KRASKUS_CHTA_LOWHASH_STRATUM_PORT: "1927"

    volumes:
      - ${APP_DATA_DIR}/config:/kraskus-config
      - ${APP_DATA_DIR}/secrets:/run/secrets:ro
      - ${APP_DATA_DIR}/pool:/ckpool-data:ro
      - ${APP_DATA_DIR}/pool-lowhash:/ckpool-lowhash-data:ro
    networks:
      - chta
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true


  ui:
    image: ghcr.io/kraskuscrypto/kraskus-chta-ui:0.2.35@sha256:a5b156128ff4bab667e703371decb060ae59ea4081ae3a5069c76efd56d116db
    restart: unless-stopped
    depends_on:
      kraskus:
        condition: service_started
    environment:
      CHTA_API_HOST: kraskus
    networks:
      - chta
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

networks:
  chta:
    name: kraskus-chta-solo-v2-qualification
