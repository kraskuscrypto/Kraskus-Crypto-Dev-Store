id: kraskus-chta-solo
name: CheetahCoin by Kraskus
tagline: CheetahCoin full node and SHA256 solo mining
description: >-
  BEFORE UPDATING: move any funds held in the old native wallet to another wallet you control, confirm receipt, and securely back up the wallet and recovery information. Never purge legacy app data to upgrade. No native wallet is exposed; existing wallet data and funds are retained.
  CHTA node with external rewards and Local SOLO, Kraskus PPLNS or Kraskus SOLO
  through the same miner host and ports: 1926 normal and 1927 low hash. Includes
  scheduled switching, optional readiness-checked local fallback and app-scoped
  forwarded-worker statistics. Every restart or upgrade starts routing paused until
  you review the saved choice. Local SOLO keeps its existing developer split;
  forwarding pays only the 1% pool fee. Node and CKPool images are unchanged.
version: 0.7.0
