services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 80
    networks:
      - public

  init:
    image: ghcr.io/kraskuscrypto/kraskus-prl-node@sha256:f0a381534c7cf28976b4d89544f9cf342935d942bf44416080ab495098ca8113
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /appdata/node /appdata/wallet /appdata/logs/node /appdata/logs/wallet /appdata/secrets
        if [ ! -s /appdata/secrets/rpc-user ]; then
          printf 'kraskus-prl-%s\n' "$(openssl rand -hex 8)" > /appdata/secrets/rpc-user
        fi
        if [ ! -s /appdata/secrets/rpc-password ]; then
          openssl rand -hex 32 > /appdata/secrets/rpc-password
        fi
        chmod 700 /appdata/secrets
        chmod 600 /appdata/secrets/rpc-user /appdata/secrets/rpc-password
    volumes:
      - ${APP_DATA_DIR}:/appdata
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  pearld:
    image: ghcr.io/kraskuscrypto/kraskus-prl-node@sha256:f0a381534c7cf28976b4d89544f9cf342935d942bf44416080ab495098ca8113
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/node:/data
      - ${APP_DATA_DIR}/logs/node:/logs
      - ${APP_DATA_DIR}/secrets/rpc-user:/run/secrets/prl_rpc_user:ro
      - ${APP_DATA_DIR}/secrets/rpc-password:/run/secrets/prl_rpc_password:ro
    ports:
      - "44108:44108/tcp"
    networks:
      - public
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - prlctl --notls --rpcserver=127.0.0.1:44107 --rpcuser=$$(cat /run/secrets/prl_rpc_user) --rpcpass=$$(cat /run/secrets/prl_rpc_password) getblockchaininfo >/dev/null 2>&1
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  oyster:
    image: ghcr.io/kraskuscrypto/kraskus-prl-node@sha256:f0a381534c7cf28976b4d89544f9cf342935d942bf44416080ab495098ca8113
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/oyster-entrypoint.sh"]
    depends_on:
      init:
        condition: service_completed_successfully
      pearld:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet
      - ${APP_DATA_DIR}/logs/wallet:/logs
      - ${APP_DATA_DIR}/secrets/rpc-user:/run/secrets/prl_rpc_user:ro
      - ${APP_DATA_DIR}/secrets/rpc-password:/run/secrets/prl_rpc_password:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  gateway:
    image: ghcr.io/kraskuscrypto/kraskus-prl-solo-gateway@sha256:97c808dadf76af57efc3aa6543ef14a29d8545ba255ca7ffc288bba4dc27f58b
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while [ ! -s /wallet/.kraskus/receive-address ]; do
          echo "KRASKUS_PRL_GATEWAY_WAITING_FOR_WALLET address_file=/wallet/.kraskus/receive-address"
          sleep 3
        done
        exec python /app/kraskus_gateway_service.py
    environment:
      PEARLD_RPC_URL: "http://pearld:44107/"
      KRASKUS_PRL_RPC_USER_FILE: "/run/secrets/prl_rpc_user"
      KRASKUS_PRL_RPC_PASSWORD_FILE: "/run/secrets/prl_rpc_password"
      KRASKUS_PRL_MINING_ADDRESS_FILE: "/wallet/.kraskus/receive-address"
      KRASKUS_PRL_STRATUM_HOST: "0.0.0.0"
      KRASKUS_PRL_STRATUM_PORT: "1902"
      KRASKUS_PRL_TELEMETRY_HOST: "0.0.0.0"
      KRASKUS_PRL_TELEMETRY_PORT: "1903"
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet:ro
      - ${APP_DATA_DIR}/secrets/rpc-user:/run/secrets/prl_rpc_user:ro
      - ${APP_DATA_DIR}/secrets/rpc-password:/run/secrets/prl_rpc_password:ro
    depends_on:
      pearld:
        condition: service_healthy
      oyster:
        condition: service_started
    ports:
      - "1902:1902/tcp"
    networks:
      - public
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ ! -s /wallet/.kraskus/receive-address ]; then exit 0; fi;
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1903/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/kraskuscrypto/kraskus-prl-solo-api@sha256:66084e7508d7e27b2653a84363d5959cb1156ec1df7f45e78b0a6c7ede1343e0
    restart: unless-stopped
    environment:
      KRASKUS_API_HOST: "0.0.0.0"
      KRASKUS_API_PORT: "18441"
      KRASKUS_PRL_APP_VERSION: "0.1.9"
      KRASKUS_PRL_RPC_URL: "http://pearld:44107/"
      KRASKUS_PRL_WALLET_RPC_URL: "http://oyster:44207/"
      KRASKUS_PRL_GATEWAY_TELEMETRY_URL: "http://gateway:1903"
      KRASKUS_PRL_RPC_USER_FILE: "/run/secrets/prl_rpc_user"
      KRASKUS_PRL_RPC_PASSWORD_FILE: "/run/secrets/prl_rpc_password"
      KRASKUS_PRL_WALLET_USER_FILE: "/run/secrets/prl_rpc_user"
      KRASKUS_PRL_WALLET_PASSWORD_FILE: "/run/secrets/prl_rpc_password"
      KRASKUS_OYSTER_BIN: "/usr/local/bin/oyster"
      KRASKUS_OYSTER_APPDATA: "/wallet"
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet
      - ${APP_DATA_DIR}/secrets/rpc-user:/run/secrets/prl_rpc_user:ro
      - ${APP_DATA_DIR}/secrets/rpc-password:/run/secrets/prl_rpc_password:ro
    depends_on:
      init:
        condition: service_completed_successfully
      pearld:
        condition: service_healthy
      oyster:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18441/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-prl-solo-ui@sha256:0f5b5fa55887c0aa5f0e7601b156961fdbe1177ebe8ef5ba6aa3c420fda3015a
    restart: unless-stopped
    environment:
      ADAPTER_HOST: api
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
