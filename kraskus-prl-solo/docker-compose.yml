{
  "networks": {
    "internal": {
      "driver": "bridge",
      "internal": true
    },
    "public": {
      "driver": "bridge"
    }
  },
  "services": {
    "api": {
      "depends_on": {
        "pearld": {
          "condition": "service_healthy"
        },
        "init": {
          "condition": "service_completed_successfully"
        }
      },
      "environment": {
        "KRASKUS_API_PORT": "18441",
        "KRASKUS_PRL_RPC_URL": "http://pearld:44107/",
        "KRASKUS_PRL_RPC_USER_FILE": "/run/secrets/prl_rpc_user",
        "KRASKUS_PRL_RPC_PASSWORD_FILE": "/run/secrets/prl_rpc_password",
        "KRASKUS_PRL_GATEWAY_URL": "http://gateway:1903",
        "KRASKUS_PRL_BLOCK_LEDGER": "/mining/blocks.jsonl",
        "KRASKUS_PRL_PUBLIC_CONFIG": "/runtime/payout",
        "KRASKUS_APP_TOKEN_FILE": "/run/kraskus-app-token/token",
        "KRASKUS_PRL_MINING_CAPABLE": "1"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18441/livez',timeout=3).read()"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 6
      },
      "image": "ghcr.io/kraskuscrypto/kraskus-prl-solo-ui@sha256:d3d7576811b2cc84f344b990f0800bd3faeeb864b6fd1e1488f67f5e27d6beab",
      "networks": {
        "internal": null
      },
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/payout",
          "target": "/runtime/payout",
          "read_only": false
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/mining",
          "target": "/mining",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/app-token",
          "target": "/run/kraskus-app-token",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/secrets/rpc-user",
          "target": "/run/secrets/prl_rpc_user",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/secrets/rpc-password",
          "target": "/run/secrets/prl_rpc_password",
          "read_only": true
        }
      ],
      "mem_limit": "256m",
      "memswap_limit": "256m",
      "cpus": 0.5,
      "read_only": true,
      "tmpfs": [
        "/tmp:size=8m"
      ],
      "init": true
    },
    "gateway": {
      "depends_on": {
        "pearld": {
          "condition": "service_healthy"
        },
        "init": {
          "condition": "service_completed_successfully"
        }
      },
      "environment": {
        "KRASKUS_PRL_BLOCK_LEDGER": "/mining/blocks.jsonl",
        "KRASKUS_PRL_MINING_ADDRESS_FILE": "/payout/payout-address",
        "KRASKUS_PRL_RPC_PASSWORD_FILE": "/run/secrets/prl_rpc_password",
        "KRASKUS_PRL_RPC_USER_FILE": "/run/secrets/prl_rpc_user",
        "KRASKUS_PRL_STRATUM_HOST": "0.0.0.0",
        "KRASKUS_PRL_STRATUM_PORT": "1902",
        "KRASKUS_PRL_TELEMETRY_HOST": "0.0.0.0",
        "KRASKUS_PRL_TELEMETRY_PORT": "1903",
        "PEARLD_RPC_URL": "http://pearld:44107/",
        "KRASKUS_PRL_SHARE_DIFFICULTY": "500000",
        "RAYON_NUM_THREADS": "1"
      },
      "healthcheck": {
        "interval": "10s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1903/health', timeout=2).read()"
        ],
        "timeout": "5s"
      },
      "image": "ghcr.io/kraskuscrypto/kraskus-prl-solo-ui@sha256:22f362063383074f8f6f989afd4d01db6f20930b1013adae90381115215c308d",
      "networks": {
        "internal": null,
        "public": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "1902",
          "target": 1902
        }
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/payout",
          "target": "/payout",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/mining",
          "target": "/mining",
          "read_only": false
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/secrets/rpc-user",
          "target": "/run/secrets/prl_rpc_user",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/secrets/rpc-password",
          "target": "/run/secrets/prl_rpc_password",
          "read_only": true
        }
      ],
      "mem_limit": "6g",
      "memswap_limit": "6g",
      "cpus": 1.5,
      "stop_grace_period": "600s"
    },
    "pearld": {
      "healthcheck": {
        "interval": "15s",
        "retries": 20,
        "start_period": "20s",
        "test": [
          "CMD-SHELL",
          "prlctl --notls --rpcserver=127.0.0.1:44107 --rpcuser=$$(cat /run/secrets/prl_rpc_user) --rpcpass=$$(cat /run/secrets/prl_rpc_password) getblockcount >/dev/null 2>&1"
        ],
        "timeout": "8s"
      },
      "image": "ghcr.io/kraskuscrypto/kraskus-prl-solo-ui@sha256:97111ac5c612835902e8387a10594b9a95bececf7de6cfe3eed6f00d3b111285",
      "networks": {
        "internal": null,
        "public": null
      },
      "ports": [
        {
          "mode": "ingress",
          "protocol": "tcp",
          "published": "44108",
          "target": 44108
        }
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "120s",
      "volumes": [
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/node-155",
          "target": "/data",
          "read_only": false
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/logs",
          "target": "/logs",
          "read_only": false
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/secrets/rpc-user",
          "target": "/run/secrets/prl_rpc_user",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/secrets/rpc-password",
          "target": "/run/secrets/prl_rpc_password",
          "read_only": true
        }
      ],
      "mem_limit": "2g",
      "memswap_limit": "2g",
      "cpus": 1.5,
      "tmpfs": [
        "/tmp:size=8m"
      ],
      "read_only": true,
      "depends_on": {
        "init": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "ui": {
      "depends_on": {
        "api": {
          "condition": "service_healthy",
          "required": true
        },
        "init": {
          "condition": "service_completed_successfully"
        }
      },
      "environment": {
        "BACKEND_HOST": "api",
        "BACKEND_PORT": "18441",
        "UI_PORT": "8080",
        "KRASKUS_APP_TOKEN_FILE": "/run/kraskus-app-token/token",
        "KRASKUS_TOKEN_READY_URL": "http://api:18441/livez"
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 3,
        "start_period": "10s",
        "test": [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/index.html"
        ],
        "timeout": "10s"
      },
      "image": "ghcr.io/kraskuscrypto/kraskus-prl-solo-ui@sha256:a7743a62a557a88ca6553cfe9081c598049da3c3b7632a0e0a99dee30f2407be",
      "networks": {
        "internal": null,
        "public": null
      },
      "ports": [
        {
          "target": 8080,
          "published": "33068",
          "host_ip": "127.0.0.1",
          "protocol": "tcp"
        }
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "5s",
      "volumes": [
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}/external-060/app-token",
          "target": "/run/kraskus-app-token",
          "read_only": true
        }
      ],
      "mem_limit": "128m",
      "memswap_limit": "128m",
      "cpus": 0.25
    },
    "init": {
      "image": "ghcr.io/kraskuscrypto/kraskus-prl-solo-ui@sha256:d3d7576811b2cc84f344b990f0800bd3faeeb864b6fd1e1488f67f5e27d6beab",
      "entrypoint": [
        "python",
        "-c"
      ],
      "command": [
        "\"\"\"Initialize new external-wallet runtime only; never open legacy wallet directories.\"\"\"\nimport os,pathlib,secrets,json\nroot=pathlib.Path('/appdata');runtime=root/'external-060'\nfor d in [root/'node-155',runtime,*[runtime/s for s in ['logs','payout','mining','secrets','app-token']]]:\n if d.is_symlink():raise SystemExit('Refusing symlink in new runtime')\n d.mkdir(mode=0o700,parents=True,exist_ok=True);os.chown(d,10001,10001);os.chmod(d,0o700)\nfor name,value,mode in [('secrets/rpc-user','kraskus-prl-'+secrets.token_hex(8)+'\\n',0o400),('secrets/rpc-password',secrets.token_hex(32)+'\\n',0o400),('app-token/token',secrets.token_hex(32)+'\\n',0o400),('payout/external-payout.json',json.dumps({'mode':'external','address':None,'enabled':False})+'\\n',0o600)]:\n f=runtime/name\n if f.is_symlink():raise SystemExit('Refusing runtime file symlink')\n if not f.exists():\n  fd=os.open(f,os.O_WRONLY|os.O_CREAT|os.O_EXCL,mode)\n  with os.fdopen(fd,'w') as out:out.write(value)\n os.chown(f,10001,10001);os.chmod(f,mode)\n"
      ],
      "user": "0:0",
      "restart": "no",
      "network_mode": "none",
      "read_only": true,
      "volumes": [
        {
          "type": "bind",
          "source": "${APP_DATA_DIR}",
          "target": "/appdata"
        }
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "64m",
      "cpus": 0.25
    },
    "app_proxy": {
      "environment": {
        "APP_HOST": "ui",
        "APP_PORT": "8080"
      },
      "networks": [
        "public"
      ]
    }
  },
  "x-5tratumos-secure-proxy": {
    "token_services": [
      "api"
    ],
    "ui_port": 8080,
    "ui_service": "ui",
    "version": 1
  }
}
