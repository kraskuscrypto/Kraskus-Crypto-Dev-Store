notes: >-
  PRL 0.1.7 pins Pearl node/Oyster binaries and all Kraskus services to
  immutable GHCR images. Stratum is exposed on TCP 1902; node RPC, Oyster RPC,
  gateway telemetry, Kraskus API, and UI backend traffic remain app-internal.
  The fixed required 1.00% developer-fee coinbase split has been validated
  against live Pearl block templates. Worker/share telemetry, estimated work
  rate, and Pearl-native Best Share scoring have been qualified on VM100 with
  a real GPU miner. A fresh-install qualification of the exact 0.1.7 store
  package is intentionally pending on a separate machine.
