notes: >-
  PRL 0.1.8 fixes fresh installation by allowing the Kraskus API and UI to
  start before the mining gateway has a wallet receive address. The gateway
  may restart while no wallet exists, then comes up automatically after wallet
  creation writes /wallet/.kraskus/receive-address. Pearl node/Oyster binaries
  and all Kraskus services remain pinned to immutable GHCR images. Stratum is
  exposed on TCP 1902; node RPC, Oyster RPC, gateway telemetry, Kraskus API,
  and UI backend traffic remain app-internal. The fixed required 1.00%
  developer-fee coinbase split remains unchanged.
