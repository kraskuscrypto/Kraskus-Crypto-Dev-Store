# 5StratumOS package for Common Foundry GPU Miner (CMFD Kraskus) 0.1.3 -- DEV
# STORE ONLY (not a Main release). Companion to kraskus-common-foundry
# (D7/WS-2); works without it. From Kraskus-Crypto-Apps @ dc767a4
# (apps/common-foundry/package/kraskus-common-foundry-gpu-miner), unchanged
# except that the images are pinned to their GHCR digests (pushed
# 2026-10-06). Qualified on 5tratumOS v0.8.28 + RTX 5070 (VM151) except the
# pool-dependent checks, deferred while the official pool was down.
#
# Host prerequisite (operator, documented; the app never installs or changes
# it): NVIDIA driver + NVIDIA Container Toolkit with the Docker runtime
# configured. Without it Docker cannot start the `miner` service and the
# install fails. 5tratumOS v0.8.28 has no GPU support of its own.
#
#   init     one-shot as root: data layout and ownership (uid 1000)
#   control  public settings (payout address, pool, worker), the app's own
#            model bank (downloaded from the official sources, SHA-256
#            pinned), the mining gate and the UI API on 18480. No GPU, no
#            wallet, no secrets. Network alias `adapter` so the shared UI
#            image's /api proxy reaches it.
#   miner    official cmfd-miner + replay worker (unmodified) under the
#            Kraskus supervisor; obeys the gate. GPU reservation here only.
#            D-6: private tmpfs home /run/cmfd-miner (uid 1000, 0700).
#   ui       Template V2 web UI (nginx) behind app_proxy, GPU Miner mode
#            (selected at runtime from /api/status app.kind).
#
# Persistent data: inputs/ (the 6.4 GB model bank; re-downloadable),
# runtime/ (settings, gate, miner stats), miner-scratch/.
# Nothing here holds wallet keys, backups or passphrases.
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
    networks:
      - cmfdgpu_private

  init:
    image: ghcr.io/kraskuscrypto/kraskus-common-foundry-miner@sha256:ee81c3562c3488bbd17bc4fd6d898e8175c92785a6a247ec3acba97ab051a78f
    pull_policy: missing
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /d/inputs /d/runtime /d/miner-scratch && chown 1000:1000 /d/inputs /d/runtime /d/miner-scratch && chmod 750 /d/runtime"
    volumes:
      - ${APP_DATA_DIR}:/d
    network_mode: "none"
    security_opt:
      - no-new-privileges:true

  control:
    image: ghcr.io/kraskuscrypto/kraskus-common-foundry-miner@sha256:ee81c3562c3488bbd17bc4fd6d898e8175c92785a6a247ec3acba97ab051a78f
    pull_policy: missing
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "/app/control.py"]
    stop_grace_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/inputs:/inputs
      - ${APP_DATA_DIR}/runtime:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18480/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # cmfdgpu_public only for outbound HTTPS to the official model-bank
    # sources; no published ports.
    networks:
      cmfdgpu_private:
        aliases:
          - adapter
      cmfdgpu_public: {}

  miner:
    image: ghcr.io/kraskuscrypto/kraskus-common-foundry-miner@sha256:ee81c3562c3488bbd17bc4fd6d898e8175c92785a6a247ec3acba97ab051a78f
    pull_policy: missing
    restart: unless-stopped
    # The official miner finishes its current GPU operation on stop.
    stop_grace_period: 3m
    depends_on:
      control:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/inputs:/inputs:ro
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/miner-scratch:/scratch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    tmpfs:
      - /tmp
      # D-6: the official miner keeps GPU lock state under $HOME; the image
      # sets HOME=/run/cmfd-miner. Process-scoped, so tmpfs is correct.
      - /run/cmfd-miner:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Outbound only, to the mining pool.
    networks:
      - cmfdgpu_public

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-common-foundry-ui@sha256:4b3ae4cf7a3cf6080c6f03b5afa0aa00164c01cb61b80467d83c098ba9db3b27
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Same rule as the base app: 5tratumOS publishes the UI port on the
    # APP_HOST service, which needs a non-internal network.
    networks:
      - cmfdgpu_private
      - cmfdgpu_public

networks:
  cmfdgpu_public:
    driver: bridge
  cmfdgpu_private:
    driver: bridge
    internal: true
