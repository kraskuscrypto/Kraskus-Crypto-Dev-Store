id: kraskus-common-foundry-gpu-miner
name: Common Foundry GPU Miner
tagline: Official Common Foundry pool miner for NVIDIA GPUs
description: >-
  Mines Common Foundry on a supported NVIDIA GPU with the official v1.0.8
  miner, unmodified, behind the Kraskus interface (CMFD Kraskus). The app
  downloads and authenticates its own copy of the 6.4 GB ForgeMatrix model
  bank, mines to the pool you choose and pays out to the Common Foundry
  address you enter. It holds no wallet and never asks for a passphrase.
  Requires the NVIDIA driver and the NVIDIA Container Toolkit on the host;
  without them the app cannot install. Works with or without the Common
  Foundry node app. Pool mining only. No developer fee.
version: 0.1.3
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Apps
support: https://kraskuscrypto.com/
icon: assets/cmfd-emblem.png
port: 33077
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
