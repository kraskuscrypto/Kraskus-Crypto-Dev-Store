# 5StratumOS package for Kraskus Quantus Solo 0.1.0 -- DEV STORE ONLY (not a Main release).
#
# Structure follows the hardened Kraskus baseline (Kaspa foundation-hardening
# candidate, Kraskus-Mining-Platform 2fa2f0b): app_proxy -> ui (nginx, plain
# app port + encrypted listener), adapter on the internal network only,
# app-scoped bridge networks, liveness-only healthchecks, x-5tratumos-stop-policy.
#
# Owner-approved ports (2026-10-02):
#   UI 33076/tcp (app_proxy, manifest `port:`), miner ingress 1935/udp -> 9833,
#   P2P 30333/tcp. RPC 9944, Prometheus 9615 and miner metrics 9900 are
#   internal only and never published.
# Encrypted HTTPS/operator listener 33078/tcp (owner-approved 2026-10-02,
# docs/PORT-REGISTRY.md). LAN only.
#
# Images pinned by GHCR digest (pushed 2026-10-02). Main release stays gated on
# G5a (source mirror, legal review), F6 (Q trademark) and Dev mining QA.

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 80

  node:
    # quantus-node built from pinned source (Quantus-Network/chain v1.0.2-Qm,
    # 482c5b9e) -- never the unsigned upstream binary (owner decision B-1).
    image: ghcr.io/kraskuscrypto/kraskus-quantus-solo-node@sha256:048b30d951501c8d65cc439f45e40d2166f44c58e4dcd21158f427470f31d888
    restart: unless-stopped
    # The accepted 0.1.0 node image (binary e40fdcf0...) was built without a
    # WORKDIR, so its entrypoint (python -m kraskus_foundation.service_init)
    # needs /app as the working directory. Set here to keep that artifact
    # unchanged; node/Dockerfile now sets WORKDIR /app for the next build.
    working_dir: /app
    # The supervisor holds quantus-node until a confirmed reward identity
    # exists, re-verifies it before every start, and forwards SIGTERM. The
    # node needed 17-29 s to stop cleanly in Phase 1 (synced); 100 s fits the
    # older CLI's 120 s budget (ui 5 + adapter 5 + miner 10 + node 100).
    stop_grace_period: 100s
    volumes:
      - ${APP_DATA_DIR}/node:/data/node
      - ${APP_DATA_DIR}/runtime:/data/runtime
      - ${APP_DATA_DIR}/miner-creds:/data/miner-creds
      - ${APP_DATA_DIR}/config:/data/config:ro
    ports:
      # Quantus P2P. Inbound peers help block propagation for a solo miner.
      - "30333:30333/tcp"
      # Miner ingress: QUIC (UDP), LAN only -- never forward from a router.
      # Protected by the auth token, the TLS certificate pin and upstream's
      # 32-unauthenticated-connection cap.
      - "1935:9833/udp"
    networks:
      - public
      - internal
    # No healthcheck: a syncing node is alive; readiness is the app's job.

  miner-local:
    # Optional local CPU miner: OFF by default, testing/fallback only (B-2).
    image: ghcr.io/kraskuscrypto/kraskus-quantus-solo-miner@sha256:e378ecd0deead1cc3f96097a7c49461e9e6be2f491193260adab4d91ed199988
    restart: unless-stopped
    stop_grace_period: 10s
    # Limit what the optional miner can take from the node and the box.
    cpus: "2.0"
    mem_limit: 512m
    volumes:
      - ${APP_DATA_DIR}/config:/data/config:ro
      - ${APP_DATA_DIR}/miner-creds:/data/miner-creds:ro
      - ${APP_DATA_DIR}/runtime:/data/runtime
    networks:
      - internal
    depends_on:
      - node

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-quantus-solo-adapter@sha256:3431a115519351a9c9406645280f439db2c11df1090d091a6d6c5c606f515460
    restart: unless-stopped
    stop_grace_period: 5s
    environment:
      LISTEN_PORT: "18430"
      QUANTUS_NODE_RPC: "http://node:9944"
      QUANTUS_NODE_PROMETHEUS: "http://node:9615/metrics"
      QUANTUS_LOCAL_MINER_METRICS: "http://miner-local:9900/metrics"
      QUANTUS_MINER_PUBLIC_PORT: "1935"
      KRASKUS_REQUIRE_TLS: "1"
      KRASKUS_SECURE_PORT: "33078"
    volumes:
      - ${APP_DATA_DIR}/config:/data/config
      - ${APP_DATA_DIR}/state:/data/state
      - ${APP_DATA_DIR}/runtime:/data/runtime
      - ${APP_DATA_DIR}/miner-creds:/data/miner-creds:ro
    networks:
      - internal
    depends_on:
      - node
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18430/livez', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-quantus-solo-ui@sha256:a82f4f1c9af43769be7bad87dd6d579afbf85736f7e3b6d8ac6ca9285ac2f210
    restart: unless-stopped
    stop_grace_period: 5s
    environment:
      ADAPTER_HOST: adapter
      ADAPTER_PORT: "18430"
    ports:
      # Encrypted listener (container 8443): 33078, owner-approved. LAN only.
      - "33078:8443/tcp"
    volumes:
      - ${APP_DATA_DIR}/tls:/tls
    networks:
      - public
      - internal
    depends_on:
      - adapter
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

x-5tratumos-stop-policy:
  version: 1
  services:
    node:
      stop_signal: SIGTERM
      stop_grace_period: 180s

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
