id: kraskus-quantus-solo
name: Quantus Solo
tagline: Quantus (QTC) full node and solo mining node
description: >-
  Quantus Solo runs a Quantus mainnet full node on 5tratumOS and lets your
  Quantus miners on the local network mine to your own wormhole reward
  address. You import the reward address and its inner hash; the app checks
  that they belong together and never asks for your 24 words. On first run
  you add the reward identity in the app; changing it later, rotating the
  miner token or regenerating its TLS certificate needs the platform's secure
  login. An optional local CPU miner is included for testing only; it is not
  profitable on mainnet. Upstream telemetry is turned off.
  Kraskus Quantus Solo includes a 1% developer fee. One out of every 100 block
  heights is assigned to the Kraskus developer reward identity; all other
  heights use your configured reward identity. Because solo mining rewards
  depend on when blocks are actually found, your realized fee percentage over
  a short period may differ from 1%. Kraskus Quantus Solo uses the official
  Quantus node source as its base. Kraskus applies a disclosed developer-fee
  modification to block-template reward selection. The miner remains
  unmodified.
version: 0.3.1
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Mining-Platform
support: https://kraskuscrypto.com/
icon: assets/quantus-solo-emblem.png
port: 33076
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 80
