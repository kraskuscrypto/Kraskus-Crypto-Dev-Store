notes: >-
  Quantus Solo 0.3.1 (Kraskus V3; foundation 1.7.1: shared V3 UI, wallet-less
  rewards, QUIC miner endpoint, mining dev-fee disclosure, first-run reward
  identity setup). Dev Store release; not a Main release.
  DEVELOPER FEE (owner decisions 2026-10-10): Kraskus Quantus Solo includes a
  1% developer fee. One out of every 100 block heights is assigned to the
  Kraskus developer reward identity; all other heights use your configured
  reward identity. Because solo mining rewards depend on when blocks are
  actually found, your realized fee percentage over a short period may differ
  from 1%. Kraskus Quantus Solo uses the official Quantus node source as its
  base. Kraskus applies a disclosed developer-fee modification to
  block-template reward selection. The miner remains unmodified. The node is a
  modified GPL-3.0 combined work (patch 0001-kraskus-dev-fee.patch, notice
  KRASKUS-MODIFICATIONS.md; Corresponding Source release quantus-solo-v0.3.0
  of https://github.com/kraskuscrypto/Quantus-Source-Mirror, published and
  signed). The node is the Kraskus dev-fee image (unchanged since 0.3.0); the
  miner is the unchanged 0.1.0 image; the adapter and UI are rebuilt and
  report 0.3.1. The 0.1.x operator layer and the 33078 HTTPS listener are
  removed; the platform authenticates. 0.3.1 (owner YES 2026-10-11): on a
  fresh install the app's own UI sets the FIRST reward identity once (POST
  /api/wallet/payout/initial, atomic, refused forever after) and can reveal
  the existing miner token (read-only). Changing the reward identity,
  rotating the miner token and regenerating the TLS certificate still need
  the 5tratumOS P2 secure proxy and are refused under the app-token fallback
  on stock 5tratumOS without P2; the generated Umbrel
  package declares the Umbrel deployment (foundation 1.6.0) and accepts them
  through Umbrel's logged-in app proxy. 0.1.x data
  paths are kept (no miner reconfiguration); operator-auth.json and tls/ are
  quarantined, never deleted. Ports: UI 33076, miner 1935/udp, P2P 30333.
  Storage guidance is provisional. Not a Main release.
