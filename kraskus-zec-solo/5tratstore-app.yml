id: kraskus-zec-solo
name: Zcash by Kraskus
tagline: Zcash full node and solo mining pool
description: Run a Zcash node and solo mine to your external wallet. Monitor synchronization,
  workers, solution rate and found blocks in a simple dashboard. Connect Equihash
  (200,9) miners on port 3335. Mining stays paused until you enter and confirm a transparent
  P2PKH (t1) payout address and explicitly start it. The fixed 1% developer fee applies
  to the miner-controlled reward; required network allocations are unchanged. There
  is no built-in wallet, seed prompt, send function or automatic shielding. Existing
  wallet files and funds are preserved through the protected migration. The existing
  320 GiB Mainnet storage preflight and pre-NU7 compatibility limits remain enforced;
  this release does not update the node or add pruning. Kraskus Pool remains under
  development.
version: 0.6.0
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Mining-Platform/tree/fc34e8511d35455976c876846772bd4754e4f659/apps/zec-solo
support: https://kraskuscrypto.com/
icon: assets/zcash.png
port: 33062
path: /
uiMode: proxy
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
