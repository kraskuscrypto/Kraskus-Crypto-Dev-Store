notes: >-
  0.3.0 is a release-qualification rebuild. Every custom image (backend, SV
  Node wrapper, UI) is built from committed source with version/revision
  labels; the UI and its approved silver hero are rebuilt from source instead
  of hand-patched images. SV Node always runs with a 10 GB excessive block
  size, passed last on its command line and verified at runtime. One
  readiness model reports Starting, Syncing, Synced, Stratum not ready,
  Setup required, Ready, Degraded, No peers or Error; zero peers, a stale tip,
  a node behind the network, a stale controller or a missing payout is never
  Ready, and Stratum port 1922 now refuses miners with the reason instead of
  accepting them without work. Wallet: the built-in SV Node wallet can be
  created, backed up as an encrypted copy of the complete wallet file,
  verified, forgotten (archived, not erased) and restored to the same
  address; it becomes a mining payout only after the backup is confirmed, and
  a 0.2.x built-in-wallet payout is paused on upgrade until its backup is
  verified. The wallet password protects backup download, restore/replace
  and Forget; it is not a spending password. Restoring a wallet older than
  the pruned node's retained blocks recovers the keys and asks before
  rebuilding chain history. Sending is removed. Blocks come from a durable
  found-block ledger and distinguish no blocks found, block data
  unavailable, maturing, confirmed, orphaned and rejected. The 1% developer
  fee is unchanged and can no longer be the customer payout.
