# 5tratumOS package for Bitcoin Satoshi Vision 0.3.1.
#
# Every custom image is built by apps/bsv-solo/build.sh from committed source
# and pinned here by tag + digest after publication (release-manifest.json).
#
#   init        backend image, one-shot (root): data layout, RPC secrets,
#               first-install bitcoin.conf, 0.2.x ownership migration
#   svnode      SV Node 1.2.2 + Kraskus supervisor. The supervisor ALWAYS
#               appends -excessiveblocksize=10000000000 (10 GB) after the
#               command below, overriding any older bitcoin.conf value; the
#               backend verifies the effective value via getsettings and
#               refuses READY otherwise. It also performs wallet swaps
#               (restore / forget) through wallet-transfer/.
#   controller  GMC -> Stratum V1 on host port 1922; 1% developer fee in every
#               coinbase (constants.py); refuses miners unless ready
#   api         appliance API + wallet lifecycle (internal 18421). No send.
#   ui          Template V2 web UI (nginx 8080 behind app_proxy)
#
# Networks and data layout are identical to 0.2.x on purpose: `init` uses the
# project default network and every long-running service uses `bsv`
# (Docker name kraskus-bsv-solo). The 5tratumOS CLI updates with
# `up --remove-orphans` and never removes a network the new compose file no
# longer declares, so renaming either would leak an address-pool slot on every
# upgraded install. 0.2.x's `ui` (legacy gateway) and `backup-export` services
# are removed as orphans on update.
#
# Published host ports: 1922 (Stratum) and 8333 (Bitcoin Satoshi Vision P2P). RPC, the
# API and the wallet-transfer directory are internal.

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
    networks:
      - bsv

  init:
    image: ghcr.io/kraskuscrypto/kraskus-bsv-solo:0.3.1@sha256:10cf0094adaf41da53bb6ee1ec261832181c2feb0cfa8e2e0e3ab5e4cda4dcd1
    restart: "no"
    user: "0:0"
    command: ["python3", "/app/init_config.py"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true

  svnode:
    image: ghcr.io/kraskuscrypto/kraskus-bsv-node:0.3.1@sha256:a5508a4b774b64702bac244d21cad9dcb5a476d92aa9d1d5e5bbe82b25e9a01d
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    # Tuning only. Consensus-critical flags (-excessiveblocksize,
    # -maxstackmemoryusageconsensus) are added by the supervisor itself.
    # dbcache 2048 MiB: 8192 drove a shared 24 GB host into full swap
    # (Docs/Dev-Store-QA/bsv.md, VM100 measurements 2026-09-24).
    command:
      - -assumevalid=000000000000000002177a2c23a3b7e00e3d406de4d523e55cc29db20de8edb3
      - -dbcache=2048
      - -maxparallelblocks=2
      - -maxparallelblocksperpeer=1
      - -blockdownloadlowerwindow=32
      - -addnode=57.128.233.172:8333
      - -addnode=195.144.22.198:8333
      - -addnode=135.125.170.182:8333
      - -addnode=15.235.232.121:8333
      - -addnode=99.127.49.102:8333
    volumes:
      - ${APP_DATA_DIR}/data/node:/data
      - ${APP_DATA_DIR}/data/wallet-transfer:/wallet-transfer
    ports:
      - "8333:8333"
    stop_grace_period: 660s
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -datadir=/data -conf=/data/bitcoin.conf getblockcount >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 600s
    networks:
      - bsv
    security_opt:
      - no-new-privileges:true

  controller:
    image: ghcr.io/kraskuscrypto/kraskus-bsv-solo:0.3.1@sha256:10cf0094adaf41da53bb6ee1ec261832181c2feb0cfa8e2e0e3ab5e4cda4dcd1
    restart: unless-stopped
    user: "999:999"
    command: ["python3", "-m", "kraskus_solo.coins.bsv.main"]
    depends_on:
      init:
        condition: service_completed_successfully
      svnode:
        condition: service_started
    environment:
      KRASKUS_BSV_RPC_URL: http://svnode:8332/
      KRASKUS_BSV_RPC_USER_FILE: /data/secrets/rpc-user
      KRASKUS_BSV_RPC_PASSWORD_FILE: /data/secrets/rpc-password
      KRASKUS_BSV_SETTINGS_FILE: /data/config/settings.json
      KRASKUS_BSV_STATUS_FILE: /data/config/status.json
      KRASKUS_BSV_WALLET_STATE_FILE: /data/config/wallet-state.json
      KRASKUS_BSV_TELEMETRY_FILE: /data/runtime/share-events.jsonl
      KRASKUS_BSV_BLOCK_LEDGER_FILE: /data/runtime/blocks.jsonl
      KRASKUS_BSV_STRATUM_PORT: "1922"
      KRASKUS_BSV_SHARE_DIFFICULTY: "16384"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      - "1922:1922"
    networks:
      - bsv
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/kraskuscrypto/kraskus-bsv-solo:0.3.1@sha256:10cf0094adaf41da53bb6ee1ec261832181c2feb0cfa8e2e0e3ab5e4cda4dcd1
    restart: unless-stopped
    user: "999:999"
    command: ["python3", "-m", "kraskus_solo.coins.bsv.api_service"]
    depends_on:
      init:
        condition: service_completed_successfully
      svnode:
        condition: service_started
    environment:
      KRASKUS_BSV_RPC_URL: http://svnode:8332/
      KRASKUS_BSV_RPC_USER_FILE: /data/secrets/rpc-user
      KRASKUS_BSV_RPC_PASSWORD_FILE: /data/secrets/rpc-password
      KRASKUS_BSV_SETTINGS_FILE: /data/config/settings.json
      KRASKUS_BSV_STATUS_FILE: /data/config/status.json
      KRASKUS_BSV_WALLET_STATE_FILE: /data/config/wallet-state.json
      KRASKUS_BSV_TELEMETRY_FILE: /data/runtime/share-events.jsonl
      KRASKUS_BSV_BLOCK_LEDGER_FILE: /data/runtime/blocks.jsonl
      KRASKUS_BSV_WALLET_TRANSFER_DIR: /wallet-transfer
      KRASKUS_BSV_STRATUM_PORT: "1922"
      KRASKUS_BSV_SHARE_DIFFICULTY: "16384"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/wallet-transfer:/wallet-transfer
    networks:
      - bsv
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-bsv-solo-ui:0.3.1@sha256:36bc8893ef71b98f25bd06e2ef7de4717aba5a75d48f410d8c83d34bed6172d9
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bsv
    security_opt:
      - no-new-privileges:true

networks:
  bsv:
    name: kraskus-bsv-solo
