id: kraskus-btc-blake2b-solo
name: XBT by Kraskus
tagline: External-wallet solo mining
description: >-
  XBT solo mining on the existing Bitcoin Knots BLAKE2b fork (activation height961640), not ordinary Bitcoin SHA-256. External payout address with a required1% developer fee paid directly in the coinbase. Node-derived coinbase maturity is retained, including the long-maturity rule. Simple Home, Mining, Blocks, Blockchain and Settings pages; themes, live worker telemetry and safe pruning controls. No user-facing native wallet. Existing wallet files are preserved during migration. Mining starts paused and requires separate setup and activation. Kraskus Pool forwarding is under development. 
version: 0.3.1
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Apps
support: https://kraskuscrypto.com/
icon: assets/xbt.png
port: 33066
path: /
uiMode: proxy
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
