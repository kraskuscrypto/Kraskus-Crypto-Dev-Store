notes: >-
  0.2.1 uses the shared external-reward interface and a separate internal
  custody signer. Legacy wallet files and history are retained without
  automatic adoption or sweeping. The existing 1% confirmed-reward fee
  and same-chain settlement policy remain. Exact-image backend, API,
  recovery, actual-bind startup/restart and financial development-chain
  tests passed. Financial tests used real mined rewards and synthetic
  gateway events; no physical Kadena ASIC was tested. Installation keeps
  mining paused and creates no mainnet keys. Signer activation requires
  owner setup, approved limits and verified off-host recovery backup.
