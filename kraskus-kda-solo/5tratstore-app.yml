id: kraskus-kda-solo
name: Kadena by Kraskus
tagline: Chainweb node and solo mining with automatic external reward forwarding
description: >-
  Kadena by Kraskus runs the community Chainweb node with status for all
  20 chains and the shared Kraskus mining interface. An internal custody
  signer forwards confirmed rewards to your configured external k: account,
  retaining the existing 1 percent developer fee. Fee and miner forwarding
  are one same-chain transaction; gas is separate and unused reservations
  remain miner-owned credit. No native-wallet controls are exposed.
  Syncing does not require a wallet. Mining remains paused until external
  rewards, the owner-managed signer and recovery backup are configured.

version: 0.2.4
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Mining-Platform
support: https://kraskuscrypto.com/
icon: assets/kraskus-kda-store.png
port: 33075
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 80
