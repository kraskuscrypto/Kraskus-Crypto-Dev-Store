# 5StratumOS package for Kraskus Kaspa Solo — release package.
#
# Self-contained: bundles its own kaspad, exactly like every other first-party
# Kraskus solo package (kraskus-zec-solo bundles zebra, kraskus-btc-blake2b-solo
# bundles knots). Command V2's shared kraskus-kaspa-kaspad and the
# kraskus-kaspa-node network belong to a separate deployment model (VM100's
# own fleet manager) and are not referenced anywhere in this file.
#
# Conventions confirmed against this box's real first-party packages:
#   - the UI service publishes NO host port itself — app_proxy (platform-managed)
#     is the only thing bound to the manifest's `port:` (33067), reaching the UI
#     container over the app's own internal network via APP_HOST/APP_PORT
#   - only ports with a real external requirement are published to the host:
#     the miner-facing Stratum port, and kaspad's P2P port (needed for normal
#     node operation, same as the current working VM100 reference)
#   - kaspad's own RPC ports (gRPC/borsh/JSON) are internal-only — nothing
#     outside this package's own containers needs them
#   - persistent data under ${APP_DATA_DIR}/<subpath>, never a hardcoded /srv path
#   - app-scoped bridge networks only, no shared/external network of any kind
#
# Approved ports for this package: UI 33067 (app_proxy, in 5tratstore-app.yml),
# Stratum 1900 (host) -> 5556 (bridge internal).

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 80

  kaspad:
    # Pinned to the exact digest currently running successfully in production
    # (kaspad reports version 2.0.1) — official kaspanet image, publicly
    # pullable, confirmed via the public Docker Hub API. Pruned by default:
    # no --archival flag, same as the current working VM100 node.
    image: kaspanet/rusty-kaspad@sha256:db36449e2f41cf33ab7c26683ce390cb71bdea9c403eefd2e740a7d5605bcd8b
    restart: unless-stopped

    command:
      - kaspad
      - --yes
      - --nologfiles
      - --disable-upnp
      - --utxoindex
      - --rpclisten=0.0.0.0:16110
      - --rpclisten-borsh=0.0.0.0:17110
      - --rpclisten-json=0.0.0.0:18110

    volumes:
      - ${APP_DATA_DIR}/node:/app/data

    # P2P is published — a solo node needs normal network participation to
    # sync, same as the current working VM100 reference. RPC (16110/17110/18110)
    # is internal-only: nothing outside this package's own containers needs it,
    # so it is not published to the host at all.
    ports:
      - "16111:16111/tcp"

    networks:
      - public
      - internal

  stratum:
    image: ghcr.io/kraskuscrypto/kraskus-kaspa-solo-stratum@sha256:3abec9a6ea547fe477fceb1c11d950a0575d28830305d7646cd966d49d09759c
    restart: unless-stopped

    command:
      - /app/stratum-bridge
      - --config
      - /config/config.yaml
      - --node-mode
      - external

    environment:
      KRASKUS_SOLO_PAYOUT_FILE: "/run/kraskus/solo-payout-address"

    # No stratum-config.yaml bind mount: 5StratumOS's real installer only
    # materializes docker-compose.yml/.env for an installed app, not extra
    # sidecar files that sit next to the compose file in the store repo — a
    # relative-path bind mount here silently resolved to an empty directory
    # on a real VM120 install, so config.yaml is now baked into the image at
    # build time instead (see apps/kaspa-solo/stratum/stratum-config.yaml and
    # build-solo-bridge-patched.sh).
    volumes:
      - ${APP_DATA_DIR}/wallet/.kraskus:/run/kraskus:ro

    ports:
      - "1900:5556/tcp"

    networks:
      - public
      - internal

    depends_on:
      - kaspad

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-kaspa-solo-adapter@sha256:f7e46b3246d5ec3a69939e7acc8fdb5330161f0ef93f6eb5780f317cef6114f7

    restart: unless-stopped

    environment:
      KASPA_STRATUM_API: http://stratum:3030
      LISTEN_PORT: "18420"
      KASPA_MINER_PORT: "1900"
      KASPAD_GRPC_ADDR: "kaspad:16110"
      KASPA_WALLET_API: "http://wallet-api:18422"

    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet

    # No host port — only "ui" (same "internal" network) talks to this.
    networks:
      - internal

    depends_on:
      - stratum
      - kaspad

  wallet-api:
    image: ghcr.io/kraskuscrypto/kraskus-kaspa-solo-wallet-api@sha256:499f19e2ebaa74ed93dcc4abf01e14694caa8bcfcd8cfd5580b8e899d5949d39

    restart: unless-stopped

    environment:
      LISTEN_PORT: "18422"
      KASPA_NETWORK: "mainnet"
      KASPA_WALLET_NAME: "kraskus"
      KASPA_WALLET_SERVER: "ws://kaspad:17110"
      KRASKUS_DEV_FEE_AUTO_PAY: "false"
      KRASKUS_SETTLEMENT_ENABLED: "true"
      KRASKUS_SETTLEMENT_WALLET_NAME: "kraskus-settlement"
      HOME: "/wallet"

    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet

    # No host port — only "adapter" talks to this, over "internal".
    networks:
      - internal

    depends_on:
      - kaspad

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-kaspa-solo-ui@sha256:7a96d44e4f188ac961d02840b993f18cf642469987b4e508f102c9efc4d908ef

    restart: unless-stopped

    # No ports: here — app_proxy (above) is the only public entry point,
    # matching every sibling Kraskus 5tratumOS app. On "public" too (not
    # published to the host) so the platform's app_proxy — which is not part
    # of this compose file and lives on its own network — can still reach
    # this service; a container that lives only on "internal" (internal:
    # true, no gateway) is unreachable from outside this compose project at
    # all, confirmed by the clean-install test.
    networks:
      - public
      - internal

    depends_on:
      - adapter

networks:
  # Only where miner/node P2P exposure requires it (stratum, kaspad).
  public:
    driver: bridge
  # kaspad/stratum/adapter/wallet-api/ui internal communication. No external
  # or shared network of any kind — fully app-scoped.
  internal:
    driver: bridge
    internal: true

