notes: >-
  Common Foundry 0.1.3, Dev Store only. Base node app (official Common
  Foundry mainnet v1.0.8, 3aa5369) with the Kraskus supervisor, adapter and
  UI; all four images built at Kraskus-Crypto-Apps dc767a4 and pinned by GHCR
  digest. Changes from 0.1.2: the full-width Mainnet banner is removed from
  Overview (network named in the header chip and Network card); the shared UI
  image also serves the separate GPU Miner companion (runtime mode from
  /api/status). Node, wallet and adapter behaviour unchanged from the
  VM100-qualified 0.1.2 (11/12 PASS; Gate 1 owner check pending). Package
  structure, ports, volumes and capabilities unchanged. No GPU miner in this
  package; no devices requested. Only P2P 29444/tcp published; UI via
  app_proxy on 33072. No telemetry, no mDNS, no developer fee. Rights fields
  stay false until the Common Foundry naming/trademark terms are published;
  the icon is the official CF emblem provided by the owner. Not a Main release.
