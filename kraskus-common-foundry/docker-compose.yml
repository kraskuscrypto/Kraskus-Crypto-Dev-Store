# 5StratumOS package for Common Foundry (CMFD Kraskus) 0.1.2 -- DEV STORE ONLY
# (not a Main release). Common Foundry mainnet v1.0.8 (3aa5369).
#
# Package from Kraskus-Crypto-Apps feature/common-foundry-v1 @ c18ef50
# (apps/common-foundry/package/kraskus-common-foundry; images built at
# c18ef50), unchanged except that the images are pinned to their GHCR digests
# (pushed 2026-10-05; each digest equals the qualified local image ID).
#
# Base node app only, as in 0.1.0: the NVIDIA miner overlay
# (docker-compose.gpu.yml in the Apps repo) is not part of the store package
# until 5tratumOS GPU delivery is decided (owner decision D3 / WS-2).
#
#   init     one-shot as root: data layout and ownership (uid 1000)
#   node     official cmfd-node (unmodified) + Kraskus supervisor:
#            model-bank preparation, node process, wallet control socket,
#            allowlisted token-protected RPC proxy on 18481 (private only).
#            P2P 29444 published (the only published port; no RPC, no metrics,
#            no mDNS, no telemetry); official RPC 127.0.0.1:29443 loopback only.
#   adapter  readiness, wallet UX, mining gate, UI API (18480), optional
#            pool statistics fetch (https egress). A normal service: sharing
#            the node's network namespace left the adapter stranded after
#            node restarts (RCNet QA).
#   ui       Template V2 web UI (nginx) behind app_proxy
#
# There is no GPU miner in this package (see above): a compose GPU
# reservation would make installation fail on hosts without the NVIDIA
# runtime.
#
# Persistent data: node/ (chain, wallet.key, wallet-archive/), inputs/ (the
# authenticated 6.4 GB model bank; re-downloadable), runtime/ (supervisor
# state, control socket, adapter state), secrets/ (node container only).
# Networks: cmfd_public, cmfd_private (internal). Names are permanent.
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
    networks:
      - cmfd_private

  init:
    image: ghcr.io/kraskuscrypto/kraskus-common-foundry-node@sha256:8f816fefba9d67f5c17d6a9b81d24bf92a4579743196fefcb8fe5a6ae8b8848d
    pull_policy: missing
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /d/node /d/inputs /d/runtime /d/secrets /d/miner-scratch && chown 1000:1000 /d/node /d/inputs /d/runtime /d/miner-scratch && chown 0:0 /d/secrets && chmod 700 /d/secrets /d/node && chmod 750 /d/runtime"
    volumes:
      - ${APP_DATA_DIR}:/d
    network_mode: "none"
    security_opt:
      - no-new-privileges:true

  node:
    image: ghcr.io/kraskuscrypto/kraskus-common-foundry-node@sha256:8f816fefba9d67f5c17d6a9b81d24bf92a4579743196fefcb8fe5a6ae8b8848d
    pull_policy: missing
    restart: unless-stopped
    # Supervisor as root with a minimal capability set so the stored wallet
    # passphrase is root:root 0600; cmfd-node itself runs as uid 1000.
    user: "0:0"
    # The supervisor stops cmfd-node with SIGTERM and waits up to 300 s.
    stop_grace_period: 6m
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/node:/data
      - ${APP_DATA_DIR}/inputs:/inputs
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/secrets:/secrets
    ports:
      - "29444:29444/tcp"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket,sys; s=socket.socket(socket.AF_UNIX); s.settimeout(5); s.connect('/runtime/control.sock'); s.sendall(b'{\"op\":\"state\"}'); s.shutdown(socket.SHUT_WR); sys.exit(0 if b'\"ok\": true' in s.recv(4096) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    tmpfs:
      - /tmp
      - /run/cmfd:mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    networks:
      - cmfd_public
      - cmfd_private

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-common-foundry-adapter@sha256:1b7fdddfdc06824fba1e4b60604f379ecf3267c23f74a4e2b96d80fc67534f20
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      node:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18480/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # cmfd_public only for outbound HTTPS to the pool statistics page the
    # customer configures (no published ports); everything else is private.
    networks:
      - cmfd_private
      - cmfd_public

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-common-foundry-ui@sha256:0ea0a40164e1b13e3110f9f3d2baf289933632022939a47d047c60c59fa5210e
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # 5tratumOS publishes the manifest UI port (33072) on the APP_HOST
    # service at install (it drops app_proxy and adds "33072:8080" to ui).
    # Docker publishes nothing for a container whose only network is
    # internal, so ui must also join the non-internal cmfd_public network or
    # the portal is refused (Dev 0.1.0 on VM100). The UI still reaches the
    # adapter over cmfd_private; it publishes no port itself.
    networks:
      - cmfd_private
      - cmfd_public

networks:
  cmfd_public:
    driver: bridge
  cmfd_private:
    driver: bridge
    internal: true
