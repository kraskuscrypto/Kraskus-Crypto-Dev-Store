<?xml version="1.0" encoding="UTF-8"?>
<!--
  Common Foundry (CMFD Kraskus) store icon, 512x512.
  The official Common Foundry "CF" emblem (provided by Kris, 2026-10-05) set
  in the Kraskus hero-coin format, as in the 0.1.2 app
  (Kraskus-Crypto-Apps apps/common-foundry/ui/components/cmfd-emblem.tsx,
  outline and copper gradient unchanged): polished copper CF with an engraved
  edge on a deep bronze coin face with a bronze rim.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b083"/>
      <stop offset="45%" stop-color="#a8501c"/>
      <stop offset="70%" stop-color="#5e2a0e"/>
      <stop offset="100%" stop-color="#c46a32"/>
    </linearGradient>
    <radialGradient id="face" cx="34%" cy="23%" r="85%">
      <stop offset="0%" stop-color="#b0602c"/>
      <stop offset="58%" stop-color="#6e2c0c"/>
      <stop offset="100%" stop-color="#2e1003"/>
    </radialGradient>
    <radialGradient id="inner" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#3d1504" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3d1504" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe2c6"/>
      <stop offset="38%" stop-color="#f2a56e"/>
      <stop offset="72%" stop-color="#d27a43"/>
      <stop offset="100%" stop-color="#a8532a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <path id="cf" d="M397 106 L680 106 L571 233 L373 233 L373 688 L585 688 L585 433 L708 308 L1075 308 L968 431 L710 431 L710 572 L970 572 L872 687 L710 687 L710 945 L587 1075 L587 812 L383 812 L245 662 L245 258 Z"/>
  </defs>
  <!-- rim -->
  <circle cx="256" cy="256" r="246" fill="url(#rim)"/>
  <!-- face -->
  <circle cx="256" cy="256" r="226" fill="url(#face)" stroke="#ffc49a" stroke-width="3"/>
  <circle cx="256" cy="256" r="219" fill="none" stroke="#b8561f" stroke-width="8"/>
  <circle cx="256" cy="256" r="215" fill="url(#inner)"/>
  <!-- official CF emblem, 62% of the face -->
  <svg x="116" y="116" width="280" height="280" viewBox="150 81 1020 1020" overflow="visible">
    <use href="#cf" fill="#ffb070" opacity="0.33" filter="url(#glow)"/>
    <use href="#cf" fill="#3d1504" transform="translate(11 15)"/>
    <use href="#cf" fill="url(#copper)" stroke="#4a1e08" stroke-width="14" stroke-linejoin="miter"/>
    <use href="#cf" fill="url(#sheen)"/>
  </svg>
</svg>
