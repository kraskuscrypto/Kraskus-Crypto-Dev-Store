id: kraskus-common-foundry
name: Common Foundry
tagline: Common Foundry mainnet node with encrypted wallet and Kraskus monitoring
description: >-
  Runs the official Common Foundry v1.0.8 node, unmodified, with its encrypted
  wallet behind the Kraskus interface (CMFD Kraskus). The app downloads and
  authenticates the ForgeMatrix model bank, syncs the mainnet chain, and walks
  you through creating, backing up and restoring your wallet. Your wallet
  passphrase is needed only to send, back up, restore or forget the wallet.
  NVIDIA mining is not included in the base package; official NVIDIA miner
  support will be added through the GPU companion package after 5tratumOS GPU
  qualification. AMD mining is not available. No developer fee.
version: 0.1.2
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Apps
support: https://kraskuscrypto.com/
icon: assets/cmfd-emblem.png
port: 33072
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
